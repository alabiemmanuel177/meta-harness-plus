# V10 model role mapping. Per V10_DESIGN.md §11.2: V10 is model-agnostic
# at the call site; this YAML is the only place a model name appears
# in business logic. To swap models for a role, change ONE line here —
# no source edits needed.
#
# Env-driven overrides: each role honors a $V10_<ROLE>_MODEL env var.
# Example: V10_RERANKER_MODEL=claude-sonnet-4-5 ./scripts/run_eval.py
#
# Meta-flag for the P3f Opus K=1 ablation (V10_DESIGN.md §11):
#   V10_USE_OPUS_PATCH_GEN=1
# When set, patch_generator_pipeline + patch_generator_agent resolve
# to claude-opus-4-7 — UNLESS the per-role env vars above are already
# set (those win). All other roles stay on deepseek-chat. Used to
# isolate the model lift on patch generation alone before committing
# to mixed-model leaderboard runs.
#
# Role-naming convention (commit 16a audit): one role per logical
# function. Legacy short names (repro_gen, patch_gen_pipeline, etc.)
# were renamed to the longer form to make their purpose unambiguous
# in code and config diffs. Phase 2/3/5 stub roles are pre-committed
# here so future implementations can't accidentally hardcode a model;
# they have to use the role label.

roles:
  # Phase 1 stage 1g — LLM rerank of aggregated candidates.
  # Default: deepseek-chat (cheap; ~$0.0024 per dev_100 instance,
  # observed across two reruns; Anthropic Sonnet/Opus available
  # for ablation via V10_RERANKER_MODEL env override).
  reranker: deepseek-chat

  # Phase 2 (commit 7b/7c, design at docs/V10_DESIGN_PHASE2.md):
  # repro_generator writes the failing pytest from the issue text;
  # repro_verifier is the optional second-pass check (re-prompt
  # path on attempts 1+ within the N=3 retry loop, per §3.4).
  repro_generator: deepseek-chat
  repro_verifier:  deepseek-chat

  # Phase 3 (V10_DESIGN.md §3.4):
  # patch_generator_pipeline = single-shot patch generation;
  # patch_generator_agent    = agentic patch generation with tool use;
  # patch_minimizer          = Phase 6 reduction (single-fix pruner).
  # All default to deepseek-chat as the cheap baseline. The design
  # intent is to swap patch_generator_agent to claude-opus-4-7 once
  # Phase 3 lands and the agent path is proved. Until then, deepseek
  # everywhere keeps the routing layer honest.
  patch_generator_pipeline: deepseek-chat
  patch_generator_agent:    deepseek-chat
  patch_minimizer:          deepseek-chat

  # Phase 5 (V10_DESIGN.md §3.6):
  # selection_reviewer            = chooses among K candidate patches;
  # selection_escalation_reviewer = Opus-tier when the primary reviewer
  #                                 is uncertain.
  # Per docs/MODEL_SWAP_PLAN.md (commit 16b): dev-time defaults are
  # locked to deepseek-chat across all roles. The leaderboard
  # mixed-model config swaps these via env vars at run-time, NOT here.
  selection_reviewer:            deepseek-chat
  selection_escalation_reviewer: deepseek-chat

# Provider routing — clients.py reads model name to dispatch.
# Anything starting with 'claude' goes to anthropic; 'deepseek' goes
# to the OpenAI-compatible endpoint at https://api.deepseek.com/v1.
# Add new providers by extending harness/llm/clients.py:_route_model.

# Cost estimates (USD per 1M tokens) — used by harness/cost.py for
# tracking. NOT for routing.
prices:
  deepseek-chat:           {input: 0.27, output: 1.10}
  deepseek-reasoner:       {input: 0.55, output: 2.19}
  claude-sonnet-4-5:       {input: 3.00, output: 15.00}
  claude-sonnet-4-6:       {input: 3.00, output: 15.00}
  claude-opus-4-7:         {input: 15.00, output: 75.00}
